name: Deploy to GitHub Pages

on:
  push:
    branches: [ngzrh-deployment]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build:gh-pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Detect build output
        id: output
        run: |
          if [ -f dist/angular-zurich/index.html ]; then
            echo "dir=dist/angular-zurich" >> "$GITHUB_OUTPUT"
          elif [ -f dist/angular-zurich/browser/index.html ]; then
            echo "dir=dist/angular-zurich/browser" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find built index.html under dist/angular-zurich" >&2
            exit 1
          fi

      - name: Add custom domain
        run: echo "angularzurich.dev" > "${{ steps.output.outputs.dir }}/CNAME"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.output.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
