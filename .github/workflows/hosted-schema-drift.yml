name: Hosted schema drift

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-schema-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare production schema with migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: krjsmflnjjbdwzzxmmtt

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Resolve the IPv4 session pooler
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';

          const { SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF, GITHUB_ENV } = process.env;
          if (!SUPABASE_ACCESS_TOKEN || !SUPABASE_DB_PASSWORD) {
            throw new Error('SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must be configured in the production environment.');
          }

          // Linking saves pooler metadata on a best-effort basis. Resolve it explicitly
          // so an API failure cannot silently fall back to an IPv6-only connection.
          const response = await fetch(
            `https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/database/pooler`,
            { headers: { Authorization: `Bearer ${SUPABASE_ACCESS_TOKEN}` }, signal: AbortSignal.timeout(30_000) },
          );
          if (!response.ok) {
            throw new Error(`Could not resolve the Supabase session pooler (HTTP ${response.status}).`);
          }

          const configs = await response.json();
          const primary = configs.find((config) => config.database_type === 'PRIMARY');
          if (!primary?.connection_string) {
            throw new Error('Supabase did not return a primary database pooler connection.');
          }

          const url = new URL(primary.connection_string.replaceAll('[YOUR-PASSWORD]', ''));
          if (!url.hostname.endsWith('.pooler.supabase.com')) {
            throw new Error('Supabase did not return a shared IPv4 pooler hostname.');
          }
          url.port = '5432'; // Session mode is required for schema introspection.
          url.password = encodeURIComponent(SUPABASE_DB_PASSWORD);
          const connectionString = url.toString();
          console.log(`::add-mask::${connectionString}`);
          appendFileSync(GITHUB_ENV, `SUPABASE_SCHEMA_DB_URL=${connectionString}\n`);
          EOF

      - name: Detect public schema drift
        run: |
          if supabase db diff --db-url "$SUPABASE_SCHEMA_DB_URL" --schema public --use-migra --output-format json > schema-drift.json; then
            :
          else
            status=$?
            echo "::error::Supabase schema comparison failed with exit code $status. Diagnostic output follows."
            cat schema-drift.json
            exit "$status"
          fi

          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';

          const { diff } = JSON.parse(readFileSync('schema-drift.json', 'utf8'));

          if (typeof diff !== 'string') {
            console.error('Supabase returned an unexpected schema-diff response:');
            console.error(readFileSync('schema-drift.json', 'utf8'));
            process.exit(1);
          }

          if (diff.trim()) {
            console.error('Production public schema differs from the repository migrations:');
            console.error(diff);
            process.exit(1);
          }

          console.log('Production public schema matches the repository migrations.');
          EOF

      - name: Retain schema comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: schema-drift
          path: schema-drift.json
          if-no-files-found: ignore
          retention-days: 7
