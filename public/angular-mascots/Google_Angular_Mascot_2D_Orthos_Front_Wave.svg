/* 33 sampled poses ease the hand through each turn, with browser interpolation
   between poses. Wave for 1.6 seconds, then rest until the five-second cycle repeats.
   The shoulder stays anchored in the original 1080 x 1080 viewBox. */
.orthos-right-hand {
  transform-box: view-box;
  transform-origin: 824px 590px;
  animation: orthos-wave 5s linear infinite;
}
@keyframes orthos-wave {
  0% { transform: rotate(0deg); }
  1% { transform: rotate(-2.664deg); }
  2% { transform: rotate(-10.251deg); }
  3% { transform: rotate(-21.606deg); }
  4% { transform: rotate(-35deg); }
  5% { transform: rotate(-48.394deg); }
  6% { transform: rotate(-59.749deg); }
  7% { transform: rotate(-67.336deg); }
  8% { transform: rotate(-70deg); }
  9% { transform: rotate(-69.048deg); }
  10% { transform: rotate(-66.339deg); }
  11% { transform: rotate(-62.284deg); }
  12% { transform: rotate(-57.5deg); }
  13% { transform: rotate(-52.716deg); }
  14% { transform: rotate(-48.661deg); }
  15% { transform: rotate(-45.952deg); }
  16% { transform: rotate(-45deg); }
  17% { transform: rotate(-46.332deg); }
  18% { transform: rotate(-50.126deg); }
  19% { transform: rotate(-55.803deg); }
  20% { transform: rotate(-62.5deg); }
  21% { transform: rotate(-69.197deg); }
  22% { transform: rotate(-74.874deg); }
  23% { transform: rotate(-78.668deg); }
  24% { transform: rotate(-80deg); }
  25% { transform: rotate(-76.955deg); }
  26% { transform: rotate(-68.284deg); }
  27% { transform: rotate(-55.307deg); }
  28% { transform: rotate(-40deg); }
  29% { transform: rotate(-24.693deg); }
  30% { transform: rotate(-11.716deg); }
  31% { transform: rotate(-3.045deg); }
  32%, 100% { transform: rotate(0deg); }
}

/* Counterbalance around the feet; nested hand motion keeps the shoulder attached. */
.orthos-body {
  transform-box: view-box;
  transform-origin: 540px 950px;
  animation: orthos-counterbalance 5s linear infinite;
}
@keyframes orthos-counterbalance {
  0% { transform: translateX(0px) rotate(0deg); }
  1% { transform: translateX(-0.167px) rotate(-0.067deg); }
  2% { transform: translateX(-0.641px) rotate(-0.256deg); }
