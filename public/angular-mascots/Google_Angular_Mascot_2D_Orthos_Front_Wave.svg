  32%, 100% { transform: translateX(0px) rotate(0deg); }
}
.orthos-eye {
  transform-box: fill-box;
  transform-origin: center;
  animation: orthos-blink 5s ease-out infinite;
}
@keyframes orthos-blink {
  0%, 56%, 62%, 100% { transform: scaleY(1); }
  58%, 59% { transform: scaleY(0.08); }
}
.orthos-brow {
  transform-box: fill-box;
  transform-origin: center;
  animation: orthos-brow-lift 5s ease-out infinite;
}
@keyframes orthos-brow-lift {
  0%, 32%, 100% { transform: translateY(0); }
  8% { transform: translateY(-10px); }
  16% { transform: translateY(-5px); }
  24% { transform: translateY(-12px); }
}

/* Reshape the palm early in the raise: flatten the original thumb
   and mirror its exact rounded contour onto the upper edge. */
.orthos-palm {
  animation: orthos-palm-shape 5s ease-out infinite;
}
