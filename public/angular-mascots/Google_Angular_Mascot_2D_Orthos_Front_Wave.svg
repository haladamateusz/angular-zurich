  .orthos-body, .orthos-right-hand, .orthos-palm, .orthos-eye, .orthos-brow { animation: none; transform: none; }
}
/* Extend the legs toward the leaning torso; their lower ends and feet stay planted. */
.mascot-leg-stretch {
  transform-box: fill-box;
  transform-origin: center bottom;
  animation: mascot-leg-extension 5s linear infinite;
}
@keyframes mascot-leg-extension {
