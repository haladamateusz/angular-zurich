<section class="hero">
  <svg class="cross-overlay" width="100%" height="100%" aria-hidden="true">
    <defs>
      <pattern id="cross-pattern" width="60" height="120" patternUnits="userSpaceOnUse">
        <!-- Row 1 -->
        <svg viewBox="0 -1 1773 1773" x="0" y="0" width="30" height="30">
          <path
            d="m369.4-0.308v221.46h221.46v147.64h-221.46v221.46h-147.64v-221.46h-221.46v-147.64h221.46v-221.46h147.64z"
            fill="currentColor">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 295.58 295"
              to="360 295.58 295"
              dur="30s"
              repeatCount="indefinite" />
          </path>
        </svg>
        <!-- Row 2 (offset 30px) -->
        <svg viewBox="0 -1 1773 1773" x="30" y="60" width="30" height="30">
          <path
            d="m369.4-0.308v221.46h221.46v147.64h-221.46v221.46h-147.64v-221.46h-221.46v-147.64h221.46v-221.46h147.64z"
            fill="currentColor">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 295.58 295"
              to="360 295.58 295"
              dur="30s"
              repeatCount="indefinite" />
          </path>
        </svg>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#cross-pattern)" />
  </svg>
  <svg class="cross-overlay cross-overlay--primary" width="100%" height="100%" aria-hidden="true">
    <defs>
      <pattern id="cross-pattern-primary" width="60" height="120" patternUnits="userSpaceOnUse">
        <svg viewBox="0 -1 1773 1773" x="0" y="0" width="30" height="30">
          <path
            d="m369.4-0.308v221.46h221.46v147.64h-221.46v221.46h-147.64v-221.46h-221.46v-147.64h221.46v-221.46h147.64z"
            fill="currentColor">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 295.58 295"
              to="360 295.58 295"
              dur="30s"
              repeatCount="indefinite" />
          </path>
        </svg>
        <svg viewBox="0 -1 1773 1773" x="30" y="60" width="30" height="30">
          <path
            d="m369.4-0.308v221.46h221.46v147.64h-221.46v221.46h-147.64v-221.46h-221.46v-147.64h221.46v-221.46h147.64z"
            fill="currentColor">
            <animateTransform
              attributeName="transform"
              type="rotate"
              from="0 295.58 295"
              to="360 295.58 295"
              dur="30s"
              repeatCount="indefinite" />
          </path>
        </svg>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#cross-pattern-primary)" />
  </svg>
  <div class="hero-content">
    <h1 class="hero-title">Meet. Learn. Ship&nbsp;Angular.</h1>
    <div class="sponsors">
      <span class="sponsors__label">Supported by</span>
      <div class="sponsors__marquee">
        <div class="sponsors__track">
          @for (sponsor of sponsors; track sponsor.name) {
            <span class="sponsors__item">
              <img [src]="sponsor.logo" [alt]="sponsor.name" class="sponsors__logo" draggable="false" width="120" height="28" />
            </span>
          }
          @for (sponsor of sponsors; track sponsor.name) {
            <span class="sponsors__item" aria-hidden="true">
              <img [src]="sponsor.logo" [alt]="sponsor.name" class="sponsors__logo" draggable="false" width="120" height="28" />
            </span>
          }
        </div>
      </div>
    </div>
  </div>
</section>
