@let event = eventDetails();

@if (event) {
  <div
    class="sticky top-0 z-50 bg-[linear-gradient(to_right,#0B5CAD,#1565C0,#1E88E5,#42A5F5)] animate-gradient text-white px-6 py-2.5 text-sm shadow-md shadow-black/10">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-y-2">
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
        <span class="font-semibold">{{ event.title }}</span>
        <span class="hidden sm:inline text-white/40">&middot;</span>
        <a [attr.href]="event.venue?.google_maps_url || null" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center gap-1 hover:underline text-white/90 hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
          </svg>
          {{ event.venue?.title }}, {{ event.venue?.street }}<span class="hidden sm:inline">, {{ event.venue?.zip }} {{ event.venue?.city }}</span>
        </a>
        <span class="hidden sm:inline text-white/40">&middot;</span>
        <span class="inline-flex items-center gap-1 text-white/90">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
          </svg>
          {{ event.starts_at | navbarDateFormat }}
        </span>
      </div>
      <a [attr.href]="event.meetup_url || null" target="_blank" rel="noopener noreferrer"
        class="border border-white/60 text-white px-4 py-2 sm:py-1 rounded-full text-xs font-medium hover:bg-white/10 transition-colors">
        Sign up
      </a>
    </div>
  </div>
}

<nav class="bg-navbar border-b border-navbar-line px-2 sm:px-6 py-0">
  <div class="max-w-5xl mx-auto flex items-center justify-between">
    <a class="flex items-center gap-2" href="/public">
      <img src="logo-flat.svg" alt="Angular Zürich logo" class="h-20 w-20" width="80" height="80" />
      <span
        class="text-2xl font-inter-tight tracking-[-0.03em] text-[#1E88E5]"><span class="font-medium">Angular </span> <span
        class="font-bold">Z&uuml;rich</span></span>
    </a>
    <div class="flex gap-2 items-center">
      <button
        (click)="toggleDarkMode()"
        class="relative inline-flex items-center justify-center w-9 h-9 rounded-full text-primary hover:bg-muted-hover transition-colors"
        [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (dark()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        }
        @if (!dark()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 6.002-2.998Z" />
          </svg>
        }
      </button>
      <a href="https://docs.google.com/forms/d/12VJwBa7DZHRsKkoaZyqIzgEgDDyjeDe4jMoIWijY8FQ"
        target="_blank"
        rel="noopener noreferrer"
        class="bg-primary text-primary-foreground px-5 py-2 rounded-full text-sm font-medium hover:bg-primary-hover transition-colors whitespace-nowrap inline-flex items-center">
        Submit Talk
      </a>
    </div>
  </div>
</nav>
