<section class="partners">
  <div class="partners__container">
    <div class="partners__header">
      <h2 class="partners__heading">Our partners</h2>
      <p class="partners__intro">
        Companies and community allies helping keep Angular Zürich open, welcoming, and sustainable.
      </p>
    </div>

    <div class="partners__grid">
      @for (partner of partners(); track partner.id) {
        <a [href]="partner.website_url" target="_blank" rel="noopener noreferrer" class="partner-card">
          <img [src]="partner.logo_url" [alt]="partner.title" class="partner-card__logo" width="160" height="40" />
        </a>
      }
    </div>
  </div>
</section>
