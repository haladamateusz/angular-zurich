@if (upcomingPublicEvent.error()) {
  <section class="home-state home-state--event">
    <app-error-notice
      title="Next event unavailable"
      [headingLevel]="1"
      message="We couldn’t load the next event. Try again to see the date, talks, and venue."
      actionLabel="Try loading the next event"
      (action)="retryUpcomingEvent()"
    />
  </section>
} @else {
  <app-hero
    [sponsors]="sponsors.value()"
    [sponsorsLoading]="sponsors.isLoading()"
    [sponsorsLoadFailed]="!!sponsors.error()"
    [eventLoading]="upcomingPublicEvent.isLoading()"
    [event]="upcomingEvent()"
    (introCompleted)="onHeroIntroCompleted()"
    (retrySponsors)="retrySponsors()"
  />
}

@if (pastEvents.error()) {
  <section class="home-state home-state--section">
    <app-error-notice
      title="Past events unavailable"
      [headingLevel]="2"
      message="We couldn’t load past event details. Try again to view the talks and slides."
      actionLabel="Try loading past events"
      (action)="retryPastEvents()"
    />
  </section>
} @else if (pastEvents.isLoading() || pastEvents.value().length) {
  <app-past-events
    [events]="pastEvents.value()"
    [loading]="pastEvents.isLoading()"
    [revealAfterHero]="shouldRevealPastEvents()"
  />
}

<app-stats />
<app-team />
@if (!sponsors.error()) {
  <app-partners [partners]="sponsors.value()" />
}
