<nav class="bg-navbar border-b border-navbar-line py-0">
  <div
    class="mx-auto flex max-w-7xl items-center justify-between px-6 max-[720px]:px-4 max-[420px]:px-[0.9rem]"
  >
    <a class="flex items-center gap-2" routerLink="/">
      <img src="logo-flat.svg" alt="Angular Zürich logo" class="h-20 w-20" width="80" height="80" />
      <span class="text-2xl font-inter-tight tracking-[-0.03em] text-[#1E88E5]"
        ><span class="font-medium">Angular </span> <span class="font-bold">Z&uuml;rich</span></span
      >
    </a>
    <div class="flex gap-2 items-center">
      <button
        (click)="toggleDarkMode()"
        class="relative inline-flex items-center justify-center w-9 h-9 rounded-full bg-transparent transition-colors"
        [class.text-primary]="!dark()"
        [class.text-primary-300]="dark()"
        [class.bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_12\%\,transparent\)\]]="
          dark()
        "
        [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_20\%\,transparent\)\]]="
          dark()
        "
        [class.hover\:text-primary-200]="dark()"
        [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (dark()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4.5 h-4.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
            />
          </svg>
        }
        @if (!dark()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-4.5 h-4.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 6.002-2.998Z"
            />
          </svg>
        }
      </button>
      @if (isAuthenticated()) {
        @if (userProfile(); as profile) {
          <details #userMenu class="relative">
            <summary
              class="flex list-none items-center gap-3 rounded-lg border px-3 py-2 text-sm font-medium transition-colors focus:outline-hidden focus:ring-2 focus:ring-primary/40 focus:ring-offset-2 focus:ring-offset-background"
              [class.border-primary/15]="!dark()"
              [class.bg-primary/5]="!dark()"
              [class.text-foreground]="!dark()"
              [class.border-primary/30]="dark()"
              [class.bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_14\%\,var\(--color-card\)_86\%)\]]="
                dark()
              "
              [class.shadow-\[0_16px_36px_-24px_rgba\(0\,0\,0\,0\.75\)\]]="dark()"
              [class.text-primary-100]="dark()"
            >
              <span class="max-w-40 truncate">{{ profile.displayName }}</span>
              @if (shouldShowAvatarImage) {
                <img
                  [src]="profile.avatarUrl"
                  [alt]="profile.displayName"
                  (error)="handleAvatarLoadError()"
                  class="h-9 w-9 rounded-lg object-cover object-center"
                  width="36"
                  height="36"
                />
              } @else {
                <div
                  class="inline-flex h-9 w-9 items-center justify-center rounded-lg text-xs font-semibold"
                  [class.bg-primary/10]="!dark()"
                  [class.text-primary]="!dark()"
                  [class.bg-primary/20]="dark()"
                  [class.text-primary-100]="dark()"
                >
                  {{ profile.displayName.charAt(0).toUpperCase() }}
                </div>
              }
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="navbar-dropdown__icon h-4 w-4 shrink-0 transition-transform duration-200"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
                aria-hidden="true"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="m19 9-7 7-7-7" />
              </svg>
            </summary>

            <div
              class="absolute right-0 top-[calc(100%+0.65rem)] z-20 min-w-52 rounded-2xl border p-2 shadow-[0_18px_48px_-24px_rgba(15,23,42,0.5)] backdrop-blur-sm"
              [class.border-navbar-line]="!dark()"
              [class.bg-card]="!dark()"
              [class.border-primary/30]="dark()"
              [class.bg-\[linear-gradient\(180deg\,color-mix\(in_srgb\,var\(--color-card\)_92\%\,black_8\%\)\,color-mix\(in_srgb\,var\(--color-card\)_84\%\,black_16\%\)\)\]]="
                dark()
              "
              [class.shadow-\[0_24px_60px_-20px_rgba\(0\,0\,0\,0\.82\)\]]="dark()"
              [class.ring-1]="dark()"
              [class.ring-white/8]="dark()"
            >
              <a
                routerLink="/talk-submission"
                (click)="closeMenu($event)"
                class="flex w-full items-center rounded-xl px-4 py-3 text-sm font-medium transition-colors"
                [class.text-primary]="!dark()"
                [class.hover\:bg-primary\/10]="!dark()"
                [class.text-primary-100]="dark()"
                [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_24\%\,transparent\)\]]="
                  dark()
                "
              >
                Submit Talk
              </a>
              <button
                type="button"
                (click)="signOut(); closeMenu($event)"
                class="mt-1 flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium transition-colors"
                [class.text-primary]="!dark()"
                [class.hover\:bg-primary\/10]="!dark()"
                [class.text-primary-100]="dark()"
                [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_24\%\,transparent\)\]]="
                  dark()
                "
              >
                Log out
              </button>
            </div>
          </details>
        }
      } @else {
        <a
          routerLink="/login"
          class="inline-flex items-center rounded-lg px-4 py-2 text-sm font-medium whitespace-nowrap transition-colors focus:outline-hidden focus:ring-2 focus:ring-primary/40 focus:ring-offset-2 focus:ring-offset-background"
          [class.text-primary]="!dark()"
          [class.hover\:bg-primary\/10]="!dark()"
          [class.text-primary-100]="dark()"
          [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_28\%\,transparent\)\]]="
            dark()
          "
        >
          Sign in
        </a>
        <a
          routerLink="/talk-submission"
          class="inline-flex items-center rounded-lg border px-5 py-2.5 text-sm font-medium whitespace-nowrap transition-colors focus:outline-hidden focus:ring-2 focus:ring-primary/40 focus:ring-offset-2 focus:ring-offset-background"
          [class.border-primary]="!dark()"
          [class.text-primary]="!dark()"
          [class.hover\:bg-primary\/10]="!dark()"
          [class.border-primary-300]="dark()"
          [class.text-primary-100]="dark()"
          [class.hover\:border-primary-200]="dark()"
          [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_20\%\,transparent\)\]]="
            dark()
          "
        >
          Submit Talk
        </a>
      }
    </div>
  </div>
</nav>
