<nav class="bg-navbar border-b border-navbar-line py-0">
  <div
    class="mx-auto flex max-w-7xl items-center justify-between px-6 max-[720px]:px-4 max-[420px]:px-[0.9rem]"
  >
    <a class="flex items-center gap-2" routerLink="/">
      <img src="logo-flat.svg" alt="Angular Zürich logo" class="h-20 w-20" width="80" height="80" />
      <span
        class="text-2xl font-inter-tight tracking-[-0.03em] text-[#1E88E5]"><span class="font-medium">Angular </span> <span
        class="font-bold">Z&uuml;rich</span></span>
    </a>
    <div class="flex gap-2 items-center">
      <button
        (click)="toggleDarkMode()"
        class="relative inline-flex items-center justify-center w-9 h-9 rounded-full bg-transparent transition-colors"
        [class.text-primary]="!dark()"
        [class.text-primary-300]="dark()"
        [class.bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_12\%\,transparent\)\]]="dark()"
        [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_20\%\,transparent\)\]]="dark()"
        [class.hover\:text-primary-200]="dark()"
        [attr.aria-label]="dark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (dark()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        }
        @if (!dark()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 6.002-2.998Z" />
          </svg>
        }
      </button>
      <a routerLink="/talk-submission"
        class="border bg-transparent px-5 py-2 rounded-full text-sm font-medium transition-colors whitespace-nowrap inline-flex items-center"
        [class.border-primary]="!dark()"
        [class.text-primary]="!dark()"
        [class.border-primary-300]="dark()"
        [class.text-primary-100]="dark()"
        [class.bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_18\%\,transparent\)\]]="dark()"
        [class.hover\:border-primary-200]="dark()"
        [class.hover\:bg-\[color\:color-mix\(in_srgb\,var\(--color-primary\)_28\%\,transparent\)\]]="dark()"
        [class.hover\:text-white]="dark()"
        [class.hover\:bg-transparent]="!dark()">
        Submit Talk
      </a>
    </div>
  </div>
</nav>
